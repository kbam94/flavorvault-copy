<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlavorVault | Recipe Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>FlavorVault</h1>
            <button id="add-recipe-btn" class="btn-primary">+</button>
        </div>
        <div class="search-bar-container">
            <input type="text" id="search-input" placeholder="Search recipes...">
            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Dessert">Dessert</option>
                <option value="Snack">Snack</option>
            </select>
        </div>
    </header>

    <main id="recipe-list" class="recipe-grid">
        <!-- Recipes will be injected here -->
    </main>

    <!-- Recipe Modal -->
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Recipe</h2>
                <button id="close-modal" class="btn-close">&times;</button>
            </div>
            <form id="recipe-form">
                <input type="hidden" id="recipe-id">
                <div class="form-group">
                    <label>Recipe Name</label>
                    <input type="text" id="recipe-name" required placeholder="e.g. Spicy Pasta">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="recipe-category">
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Snack">Snack</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cooking Time (mins)</label>
                    <input type="number" id="recipe-time" required placeholder="30">
                </div>
                <div class="form-group">
                    <label>Ingredients (one per line)</label>
                    <textarea id="recipe-ingredients" rows="4" required placeholder="2 cups flour&#10;1 egg"></textarea>
                </div>
                <div class="form-group">
                    <label>Instructions</label>
                    <textarea id="recipe-instructions" rows="4" required placeholder="Mix ingredients and bake..."></textarea>
                </div>
                <button type="submit" class="btn-save">Save Recipe</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
